    # Reverse proxy for the Shiny app (inside the server { } block of the site).
    # WARNING: the original app evaluates the 'Available spots' text as R code (eval(parse())), so
    # anyone who can open the page can run R code on the server. Do not expose it publicly; restrict
    # access, e.g. with an IP allowlist or basic authentication as below.
    location = /grouptherapy { return 301 /grouptherapy/; }
    location /grouptherapy/ {
        # allow 192.0.2.0/24;  deny all;
        # auth_basic "Group therapy allocation"; auth_basic_user_file /etc/nginx/grouptherapy.htpasswd;
        proxy_pass http://127.0.0.1:3838/grouptherapy/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        client_max_body_size 5m;
        limit_req zone=grouptherapy_req burst=60 nodelay;
        limit_conn grouptherapy_conn 10;
        limit_req_status 429;
        limit_conn_status 429;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
